- upcloud:
    credentialsId: "upcloud-api"
    instanceCap: 10
    name: "upcloud"
    noDelayProvisioning: false
    templates:
    - connectionNetwork: PRIVATE
      image: "01000000-0000-4000-8000-000030240200"
      instanceCap: 5
      javaPath: "/opt/java/bin/java"
      jvmOptions: "-Xmx512m"
      labelString: "linux docker"
      mode: EXCLUSIVE
      name: "linux"
      nodeProperties:
      - envVars:
          env:
          - key: "CLOUD"
            value: "upcloud"
      numExecutors: 2
      plan: "2xCPU-4GB"
      privateNetwork: "03aa7245-0000-4000-8000-000000000002"
      publicIpv4: false
      publicIpv6: true
      remoteFs: "/var/jenkins"
      shutdownPolicy:
        idle:
          idleMinutes: 30
      sshCredentialsId: "agent-ssh"
      sshPort: 2222
      startupTimeoutSeconds: 300
      storageSizeGb: 100
      storageTier: "standard"
      userData: |-
        #!/bin/sh
        apt-get update
        apt-get install -y default-jre-headless
      utilityNetwork: false
      zone: "fi-hel1"
    - image: "01000000-0000-4000-8000-000030240200"
      labelString: "minimal"
      name: "minimal"
      plan: "1xCPU-1GB"
      shutdownPolicy:
        idle:
          idleMinutes: 10
      sshCredentialsId: "agent-ssh"
      zone: "nl-ams1"
    - image: "01000000-0000-4000-8000-000030240200"
      labelString: "hourly"
      name: "hourly"
      plan: "1xCPU-1GB"
      shutdownPolicy: "billingHour"
      sshCredentialsId: "agent-ssh"
      zone: "nl-ams1"
